<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAB Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* White page. Johor flag red and blue are used only on the rule, mark, links, and chart. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f3f6fb; --ink:#1a2744; --ink2:#4a5670; --muted:#7a8498; --line:#e4e9f2;
  --accent:#1a3a8c; --accent-ink:#ffffff; --red:#c8102e; --head-bg:#ffffff; --head-ink:#1a2744;
  --good:#1f8a4c; --warn:#c48a06; --high:#d4621d; --crit:#c8102e;
  --f-body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-disp:'Barlow Condensed','Barlow','Arial Narrow',sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;line-height:1.05}
h2{font-size:21px;line-height:1.1}
.mono{font-feature-settings:"tnum";letter-spacing:.02em}

/* command bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head-bg);color:var(--head-ink);border-bottom:2px solid var(--red);box-shadow:0 1px 0 var(--accent)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-disp);font-size:26px;letter-spacing:.06em;color:var(--accent);line-height:1;display:block}
.brand span{font-size:12px;opacity:.8;display:block;line-height:1.2}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .role{font-size:13px;opacity:.9;text-align:right;min-width:0}
.btn{background:transparent;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);border-radius:6px;padding:6px 12px;font-size:13px}
.btn:hover{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}

main{padding-block:22px 48px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:8px;align-items:center}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:6px 0 0;color:var(--ink2);max-width:62ch}
.scope{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.scope b{color:var(--ink);font-weight:600}
.scope svg{color:var(--accent)}
.asof{font-size:12px;color:var(--muted);margin-top:6px;text-align:right}

.callout{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:8px;padding:12px 14px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.callout svg{flex:none;color:var(--warn);margin-top:2px}
.callout p{margin:0}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:14px}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);margin-bottom:14px}
.two-eq{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-bottom:14px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h2{margin-bottom:2px}
.card .sub{color:var(--ink2);font-size:13px;margin:0 0 12px}
.sec{margin:26px 0 10px}
.sec p{margin:4px 0 0;color:var(--ink2);font-size:14px}

.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:600}
.kpi .v{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1.05;display:flex;align-items:baseline;gap:6px}
.kpi .v small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink2)}
.kpi .s{font-size:13px;color:var(--ink2)}
.kpi .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.d{font-size:12px;font-weight:600;white-space:nowrap}
.d.good{color:var(--good)}.d.bad{color:var(--crit)}.d.flat{color:var(--ink2)}
.spark{flex:none;display:block}
.spark path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.tab{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.tx{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--accent);opacity:.1}
.dotc{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.endv{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--f-body)}
.xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:5px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);z-index:3}
details{margin-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--accent)}

.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:600}
th button{background:none;border:0;padding:0;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;font-size:inherit;color:inherit}
th button[data-on="1"]{color:var(--accent)}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
.lk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:3px}
.cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mini{width:56px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.mini i{display:block;height:100%;background:var(--accent)}
.chip{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid}
.chip.stable{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.chip.watch{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.chip.priority{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 55%,transparent);background:color-mix(in srgb,var(--crit) 10%,var(--surface))}
.lvp{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.l1{background:var(--good)}.l2{background:var(--warn)}.l3{background:var(--high)}.l4{background:var(--crit)}

.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.hb .tr{height:12px;background:var(--surface2);border-radius:6px;position:relative}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:0 5px 5px 0;min-width:2px}
.hb .tr u{position:absolute;top:-3px;width:2px;height:18px;background:var(--ink);text-decoration:none}
.hb .vv{font-weight:600;text-align:right;white-space:nowrap}
.key{font-size:12px;color:var(--ink2);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.key u{display:inline-block;width:2px;height:12px;background:var(--ink);vertical-align:middle;margin-right:5px;text-decoration:none}

.lvl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lvl:last-child{border-bottom:0}
.lvl .t{min-width:0}.lvl .t b{display:block;font-size:14px}.lvl .t span{font-size:12px;color:var(--ink2)}
.lvl .n{font-family:var(--f-disp);font-size:24px;font-weight:700}

.units{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.unit:hover{border-color:var(--accent)}
.unit b{font-size:16px}
.unit .m{font-size:13px;color:var(--ink2)}
.seg{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden}
.seg i{display:block;min-width:3px}
.seg .g{background:var(--good)}.seg .r{background:var(--warn)}.seg .h{background:var(--crit)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:6px}

.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border-bottom:0}
.feed small{display:block;color:var(--ink2);font-size:12px}
.feed time{color:var(--ink2);font-size:12px;white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.lock{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:12px}
.note{display:flex;gap:10px;font-size:13px;color:var(--ink2);margin-top:20px;padding:12px 14px;border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.note svg{flex:none;color:var(--accent);margin-top:2px}
.more{margin-top:10px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 14px;font-size:13px}

/* sign-in */
.login{min-height:100vh}
.login .hero{background:var(--head-bg);color:var(--head-ink);border-bottom:2px solid var(--red);box-shadow:0 1px 0 var(--accent)}
.login .hero .in{padding-block:34px 30px}
.login .hero h1{color:var(--accent);font-size:46px;letter-spacing:.05em}
.login .hero p{margin:8px 0 0;max-width:58ch;opacity:.9}
.login .body{padding-block:24px 48px}
.lg{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));margin-top:8px}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.acct:hover{border-color:var(--accent)}
.acct b{font-size:15px}.acct span{font-size:13px;color:var(--ink2)}
.acct.big{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--red)}
.selrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;max-width:100%;flex:1 1 260px}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 16px;font-weight:600}
.lh{font-family:var(--f-disp);font-size:18px;margin:22px 0 0;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.card,.unit,.acct{transition:border-color .15s}}
</style>

</head>
<body>
<div id="app"></div>

<script>
(function(){
var MONTHS=['May','Jun','Jul','Aug','Sep','Oct'];
var REGIONS=['Northern','Central','Southern','East Coast','Sabah','Sarawak'];
var RW_N=[.17,.33,.16,.13,.11,.10], RW_A=[.14,.36,.18,.12,.11,.09], R_OFF=[0,1,-1,-2,1,0];
var IND=['Stress & Burnout','Emotional Distress','Fatigue & Sleep','Anxiety','Behavioural Changes','Social Withdrawal','Trauma Exposure','Depression (screening)'];
var LV=[{n:1,name:'Low',act:'Self-help & monitoring'},{n:2,name:'Moderate',act:'Supervisor engagement'},{n:3,name:'High',act:'Immediate assessment & referral'},{n:4,name:'Critical',act:'Urgent intervention & professional care'}];
var STEP_TXT={3:'Awaiting welfare assessment',4:'Supervisor engagement',5:'With internal counsellor',6:'KKM referral in progress',7:'Follow-up & recovery monitoring'};
var MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* Sample data. Agency figures add up to the national totals shown in the KAB executive summary. */
var AG=[
 {id:'pdrm',short:'PDRM',name:'Polis Diraja Malaysia',head:'Ketua Polis Negara',n:132000,score:[78,79,79,80,80,81],stress:[58,57,59,57,56,55],burn:[34,35,35,33,32,31],alerts:[49,53,56,58,60,71],int:190,intP:170,ref:112,refP:98,kkm:32,kkmP:30,rec:79,recP:70,chk:68,open:[640,118,9],ind:[27,17,16,12,10,7,7,4]},
 {id:'imi',short:'Imigresen',name:'Jabatan Imigresen Malaysia',head:'Ketua Pengarah Imigresen',n:11500,score:[82,82,83,83,84,84],stress:[47,47,46,46,45,45],burn:[24,24,23,23,22,22],alerts:[6,6,7,6,7,8],int:22,intP:20,ref:14,refP:12,kkm:4,kkmP:4,rec:80,recP:73,chk:73,open:[82,14,1],ind:[30,19,17,11,9,6,2,6]},
 {id:'pen',short:'Penjara',name:'Jabatan Penjara Malaysia',head:'Pesuruhjaya Penjara',n:17000,score:[78,77,77,76,76,76],stress:[60,61,62,63,63,64],burn:[38,39,40,41,41,42],alerts:[17,18,19,20,21,25],int:62,intP:55,ref:38,refP:33,kkm:12,kkmP:11,rec:72,recP:66,chk:61,open:[165,41,4],ind:[26,18,12,13,9,10,8,4]},
 {id:'rela',short:'RELA',name:'Jabatan Sukarelawan Malaysia',head:'Ketua Pengarah RELA',n:15000,score:[87,87,88,88,88,88],stress:[38,38,37,37,36,36],burn:[17,17,16,16,16,15],alerts:[5,5,6,5,6,6],int:17,intP:15,ref:10,refP:9,kkm:2,kkmP:2,rec:82,recP:75,chk:77,open:[48,8,1],ind:[31,16,18,10,10,6,5,4]},
 {id:'aadk',short:'AADK',name:'Agensi Antidadah Kebangsaan',head:'Ketua Pengarah AADK',n:3800,score:[85,85,86,86,86,86],stress:[42,41,41,40,40,40],burn:[20,20,19,19,19,18],alerts:[3,4,3,4,4,4],int:10,intP:9,ref:6,refP:5,kkm:1,kkmP:1,rec:85,recP:78,chk:82,open:[21,5,0],ind:[29,17,14,12,10,8,6,4]},
 {id:'jpn',short:'JPN',name:'Jabatan Pendaftaran Negara',head:'Ketua Pengarah JPN',n:8200,score:[86,86,87,87,87,87],stress:[41,41,40,40,40,39],burn:[19,19,18,18,18,18],alerts:[5,5,6,6,6,7],int:25,intP:22,ref:12,refP:10,kkm:3,kkmP:3,rec:80,recP:73,chk:80,open:[52,9,1],ind:[34,15,19,10,9,6,2,5]},
 {id:'oth',short:'Other agencies',name:'Other KDN agencies & informant agencies',head:null,n:2500,score:[84,84,85,85,85,85],stress:[43,43,42,42,42,41],burn:[21,21,20,20,20,19],alerts:[3,3,4,4,3,5],int:16,intP:14,ref:6,refP:5,kkm:2,kkmP:1,rec:79,recP:72,chk:72,open:[20,5,0],ind:[30,17,16,11,10,7,5,4]}
];
/* Supervisor units: [id, agency, name, region, code, team, good, at risk, high] */
var UNITS=[
 ['cheras','pdrm','IPD Cheras','Central','PDRM',128,76,34,18],['jbs','pdrm','IPK Johor Bahru Selatan','Southern','PDRM',164,110,38,16],['kb','pdrm','IPD Kota Bharu','East Coast','PDRM',97,66,24,7],
 ['klia','imi','Pejabat Imigresen KLIA','Central','IMI',142,104,30,8],['jbj','imi','JIM Johor Bahru','Southern','IMI',88,64,19,5],['jpp','imi','JIM Pulau Pinang','Northern','IMI',76,57,15,4],
 ['kjg','pen','Penjara Kajang','Central','PEN',210,128,58,24],['sgb','pen','Penjara Sungai Buloh','Central','PEN',184,116,50,18],['kk','pen','Penjara Kota Kinabalu','Sabah','PEN',96,66,24,6],
 ['rsl','rela','RELA Selangor','Central','REL',120,98,19,3],['rjh','rela','RELA Johor','Southern','REL',95,79,14,2],['rsb','rela','RELA Sabah','Sabah','REL',88,72,14,2],
 ['akl','aadk','AADK Kuala Lumpur','Central','AAD',54,44,8,2],['ajh','aadk','AADK Johor','Southern','AAD',41,34,6,1],['akd','aadk','AADK Kedah','Northern','AAD',38,31,6,1],
 ['jput','jpn','JPN WP Putrajaya','Central','JPN',140,113,23,4],['jjh','jpn','JPN Johor','Southern','JPN',75,62,11,2],['jsw','jpn','JPN Sarawak','Sarawak','JPN',64,52,10,2]
].map(function(a){return {id:a[0],ag:a[1],name:a[2],region:a[3],code:a[4],tot:a[5],good:a[6],risk:a[7],high:a[8]}});

/* helpers */
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function wavg(a,f,w){w=w||function(x){return x.n};return sum(a,function(x){return f(x)*w(x)})/sum(a,w)}
function agency(id){return AG.filter(function(a){return a.id===id})[0]}
function unit(id){return UNITS.filter(function(u){return u.id===id})[0]}
function fmt(n){return Math.round(n).toLocaleString('en-MY')}
function alloc(total,w){var raw=w.map(function(x){return x*total}),fl=raw.map(Math.floor),rem=total-sum(fl,function(x){return x});raw.map(function(r,i){return[r-fl[i],i]}).sort(function(a,b){return b[0]-a[0]}).slice(0,rem).forEach(function(o){fl[o[1]]++});return fl}
function agg(list){
  var ser=function(k){return MONTHS.map(function(_,i){return wavg(list,function(x){return x[k][i]})})};
  var tot=function(k){return sum(list,function(x){return x[k]})};
  var wa=sum(list,function(x){return x.alerts[5]});
  return {n:tot('n'),score:ser('score'),stress:ser('stress'),burn:ser('burn'),
    alerts:MONTHS.map(function(_,i){return sum(list,function(x){return x.alerts[i]})}),
    int:tot('int'),intP:tot('intP'),ref:tot('ref'),refP:tot('refP'),kkm:tot('kkm'),kkmP:tot('kkmP'),
    rec:wavg(list,function(x){return x.rec},function(x){return x.int}),recP:wavg(list,function(x){return x.recP},function(x){return x.intP}),
    chk:wavg(list,function(x){return x.chk}),
    open:[0,1,2].map(function(i){return sum(list,function(x){return x.open[i]})}),
    ind:IND.map(function(_,i){return wa?sum(list,function(x){return x.ind[i]*x.alerts[5]})/wa:0})};
}
function status(score,alerts,prev){if(score<78)return'Priority';if(score<82||(prev>=5&&alerts/prev>=1.25))return'Watch';return'Stable'}
function band(s){return s>=80?'Good':s>=70?'Fair':'Concern'}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dstr(off){var d=new Date(2026,9,20);d.setDate(d.getDate()+off);return d.getDate()+' '+MONTH_NAMES[d.getMonth()]}

var unitCache={};
function buildUnit(u){
  if(unitCache[u.id])return unitCache[u.id];
  var r=rng(hash(u.id)),used={};
  var code=function(){var c;do{c=u.code+'-'+(1000+Math.floor(r()*9000))}while(used[c]);used[c]=1;return c};
  var att=u.risk+u.high,action=Math.round(u.high*.45),refs=Math.round(u.high*.33),fu=Math.round(att*.23);
  var crit=u.high>=10?Math.min(refs,Math.max(1,Math.round(u.high/9))):0;
  var rows=[],i;
  for(i=0;i<u.high;i++){
    var role,level,step,ref='—';
    if(i<refs){role='ref';level=i<crit?4:3;step=i%2===0?5:6;ref=step===5?'Internal counsellor':'KKM Mental Health Services'}
    else if(i<refs+action){role='action';level=3;step=3}
    else{role='follow';level=3;step=7}
    rows.push({id:code(),level:level,step:step,role:role,ref:ref,ind:level===4?'Urgent welfare alert':IND[Math.floor(r()*6)]});
  }
  for(i=0;i<u.risk;i++)rows.push({id:code(),level:2,step:r()<.2?7:4,role:'engage',ref:'—',ind:IND[Math.floor(r()*6)]});
  var idx=rows.map(function(_,k){return k});
  for(i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}
  rows.forEach(function(x){x.due=1+Math.floor(r()*12)});
  idx.slice(0,fu).forEach(function(k){rows[k].due=-Math.floor(r()*3)});
  rows.sort(function(a,b){return b.level-a.level||a.due-b.due});
  var times=['Today 09:25','Today 08:40','Today 07:10','Yesterday 17:20','Yesterday 14:05'];
  var feed=rows.slice(0,5).map(function(x,k){return {id:x.id,ind:x.ind,level:x.level,time:times[k]}});
  return unitCache[u.id]={u:u,rows:rows,action:action,refs:refs,fu:fu,feed:feed};
}

function delta(cur,prev,mode,goodDir){
  var d=mode==='pct'?(cur-prev)/prev*100:cur-prev;
  var txt=mode==='pct'?(d>=0?'+':'')+Math.round(d)+'%':(d>=0?'+':'')+d.toFixed(1)+' pts';
  var cls=Math.abs(d)<0.05?'flat':((d>0)===(goodDir==='up')?'good':'bad');
  return '<span class="d '+cls+'"><span aria-hidden="true">'+(d>0.05?'▲':d<-0.05?'▼':'■')+'</span> '+txt+' vs Sep</span>';
}
function spark(vals){
  var w=92,h=26,mn=Math.min.apply(0,vals),mx=Math.max.apply(0,vals),sp=(mx-mn)||1;
  var x=function(i){return 2+i*(w-8)/(vals.length-1)},y=function(v){return 3+(1-(v-mn)/sp)*(h-8)};
  var d=vals.map(function(v,i){return(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)}).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><path d="'+d+'"/><circle cx="'+x(vals.length-1).toFixed(1)+'" cy="'+y(vals[vals.length-1]).toFixed(1)+'" r="3"/></svg>';
}
function chip(s){return '<span class="chip '+s.toLowerCase()+'"><span aria-hidden="true">'+({Stable:'●',Watch:'▲',Priority:'■'}[s])+'</span> '+s+'</span>'}
function lvp(n){return '<span class="lvp"><i class="dot l'+n+'"></i>L'+n+' '+LV[n-1].name+'</span>'}
function kpi(l,v,small,sub,dl,sp){
  return '<div class="card kpi"><span class="l">'+l+'</span><span class="v">'+v+(small?'<small>'+small+'</small>':'')+'</span><span class="s">'+sub+'</span><div class="row">'+(dl||'<span></span>')+(sp||'')+'</div></div>';
}
function kpis(a){
  var s=a.score[5];
  return '<div class="grid kpis">'+
   kpi('Wellbeing score',Math.round(s),'/100 · '+band(s),'Personnel average',delta(s,a.score[4],'pts','up'),spark(a.score))+
   kpi('High-risk alerts',fmt(a.alerts[5]),'','This month',delta(a.alerts[5],a.alerts[4],'pct','down'),spark(a.alerts))+
   kpi('Interventions',fmt(a.int),'','This month',delta(a.int,a.intP,'pct','up'))+
   kpi('Counsellor referrals',fmt(a.ref),'','This month',delta(a.ref,a.refP,'pct','up'))+
   kpi('KKM referrals',fmt(a.kkm),'','Mental health services',delta(a.kkm,a.kkmP,'pct','up'))+
   kpi('Recovery rate',Math.round(a.rec)+'%','','Closed cases',delta(a.rec,a.recP,'pts','up'))+
   kpi('Weekly check-ins',Math.round(a.chk)+'%','','Personnel using AI companion','')+
  '</div>';
}

function registerChart(id,vals,fm){charts.push({id:id,vals:vals,fmt:fm})}
function trendCard(a,scopeName){
  var m=METRICS[metric],vals=a[m.key],id='c-trend';
  registerChart(id,vals,function(v){return v.toFixed(m.dec)+m.unit});
  var tabs=Object.keys(METRICS).map(function(k){return '<button class="tab" data-act="metric" data-v="'+k+'" aria-pressed="'+(k===metric)+'">'+METRICS[k].label+'</button>'}).join('');
  var rows=MONTHS.map(function(mo,i){return '<tr><td>'+mo+' 2026</td><td class="num">'+vals[i].toFixed(m.dec)+m.unit+'</td></tr>'}).join('');
  return '<div class="card"><h2>'+scopeName+' '+m.label.toLowerCase()+'</h2><p class="sub">Last 6 months · '+(m.good==='up'?'higher is better':'lower is better')+'</p>'+
   '<div class="tabs" role="group" aria-label="Metric">'+tabs+'</div><div class="chart" id="'+id+'"></div>'+
   '<details><summary>Table view</summary><div class="tw"><table><thead><tr><th>Month</th><th class="num">'+m.label+'</th></tr></thead><tbody>'+rows+'</tbody></table></div></details></div>';
}
function casesCard(a){
  var l1=Math.round(a.n*a.chk/100)-sum(a.open,function(x){return x});
  var cnt=[l1,a.open[0],a.open[1],a.open[2]],tot=sum(cnt,function(x){return x});
  var rows=LV.map(function(l,i){return '<div class="lvl"><i class="dot l'+l.n+'"></i><div class="t"><b>Level '+l.n+' · '+l.name+'</b><span>'+l.act+'</span></div><div class="n">'+fmt(cnt[i])+'</div></div>'}).join('');
  var seg=cnt.map(function(c,i){return '<i style="flex:'+Math.max(c,tot*0.004)+';background:var(--'+['good','warn','high','crit'][i]+')"></i>'}).join('');
  return '<div class="card"><h2>Personnel by risk level</h2><p class="sub">Open cases and participating personnel</p><div class="seg" style="gap:2px" aria-hidden="true">'+seg+'</div><div style="margin-top:8px">'+rows+'</div></div>';
}
function pathwayCard(a){
  var mx=a.int,row=function(l,v){return '<div class="hb" style="grid-template-columns:minmax(110px,150px) minmax(0,1fr) auto"><span>'+l+'</span><div class="tr"><i style="width:'+(v/mx*100)+'%"></i></div><span class="vv">'+fmt(v)+'</span></div>'};
  return '<div class="card"><h2>Referral pathway</h2><p class="sub">This month</p>'+row('Interventions',a.int)+row('Counsellor referrals',a.ref)+row('KKM referrals',a.kkm)+'</div>';
}
function indCard(a){
  var o=IND.map(function(n,i){return {n:n,v:a.ind[i]}}).sort(function(x,y){return y.v-x.v}),mx=o[0].v;
  return '<div class="card"><h2>What the AI is flagging</h2><p class="sub">Share of this month’s alerts by indicator. Flags are screening signals for human review, not diagnoses.</p>'+
   o.map(function(x){return '<div class="hb"><span>'+x.n+'</span><div class="tr"><i style="width:'+(x.v/mx*100)+'%"></i></div><span class="vv">'+Math.round(x.v)+'%</span></div>'}).join('')+'</div>';
}
function levelLegend(){
  return '<div class="card"><h2>Risk levels and escalation</h2><p class="sub">Every level has a defined next step.</p>'+LV.map(function(l){return '<div class="lvl"><i class="dot l'+l.n+'"></i><div class="t"><b>Level '+l.n+' · '+l.name+'</b><span>'+l.act+'</span></div><span></span></div>'}).join('')+'</div>';

function privacyNote(tier){
  var t={nat:'This view shows anonymised, aggregated figures only. No officer is identifiable at ministerial level.',
         head:'This view shows anonymised, aggregated figures for your agency. Officer-level detail is available to unit supervisors only.',
         sup:'Supervisors see wellbeing status and the next step for each officer. Chat content, AI scores and clinical notes stay with the counsellor.'}[tier];

function loginView(){
  var heads=AG.filter(function(a){return a.head}).map(function(a){return '<button class="acct" data-act="login" data-v="head:'+a.id+'"><b>'+a.head+'</b><span>'+a.short+' only</span></button>'}).join('');
  var opts=UNITS.map(function(u){return '<option value="'+u.id+'">'+agency(u.ag).short+' · '+u.name+'</option>'}).join('');
  return '<div class="login"><div class="hero"><div class="in"><h1>KAB</h1><p>Kesejahteraan Anggota Bersepadu. Wellbeing dashboards for the Minister of Home Affairs, each agency head and unit supervisors.</p></div></div>'+
   '<div class="in body"><p class="lh" style="margin-top:0">Ministerial</p><div class="lg"><button class="acct big" data-act="login" data-v="minister"><b>Menteri Dalam Negeri</b><span>All agencies</span></button></div>'+
   '<p class="lh">Agency heads</p><div class="lg">'+heads+'</div>'+
   '<p class="lh">Unit supervisors</p><div class="selrow"><select id="supSel" aria-label="Choose a unit">'+opts+'</select><button class="go" data-act="login-sup">Open supervisor view</button></div>'+
   '<div class="note">'+I.lock+'<span>Preview with sample data. Each role loads only its own scope: an agency head sees one agency, a supervisor sees one unit. A live system needs agency single sign-on and server-side access control behind this.</span></div></div></div>';
}

function guard(){
  if(session.role==='head'){nav.agencyId=session.agencyId;if(nav.unitId&&unit(nav.unitId).ag!==session.agencyId)nav.unitId=null}
  if(session.role==='sup')nav={agencyId:session.agencyId,unitId:session.unitId};
  if(nav.unitId)nav.agencyId=unit(nav.unitId).ag;
}
function roleTitle(){
  if(session.role==='minister')return 'Menteri Dalam Negeri';
  if(session.role==='head')return agency(session.agencyId).head+' · '+agency(session.agencyId).short;
  return 'Penyelia · '+unit(session.unitId).name;
}
function render(){
  charts=[];
  if(!session){app.innerHTML=loginView();return}
  guard();
  var view=nav.unitId?unitView(nav.unitId):nav.agencyId?agencyView(nav.agencyId):nationalView();
  app.innerHTML='<header class="top"><div class="in"><div class="brand">'+I.shield+'<div><b>KAB</b><span>Kesejahteraan Anggota Bersepadu</span></div></div><div class="who"><span class="role">'+roleTitle()+'</span><button class="btn" data-act="out">Sign out</button></div></div></header><main class="in">'+view+'</main>';
  drawCharts();
}

/* ---------- charts ---------- */
function drawCharts(){charts.forEach(drawLine)}
function drawLine(c){
  var host=document.getElementById(c.id);if(!host)return;
  var W=Math.max(280,host.clientWidth),H=230,m={l:42,r:50,t:16,b:28},v=c.vals,n=v.length;
  var mn=Math.min.apply(0,v),mx=Math.max.apply(0,v),sp=(mx-mn)||1,lo=mn-sp*.6,hi=mx+sp*.6,raw=(hi-lo)/3;
  var step=[1,2,2.5,5,10,20,50,100].filter(function(s){return s>=raw})[0]||100;
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  var x=function(i){return m.l+i*(W-m.l-m.r)/(n-1)},y=function(val){return m.t+(1-(val-lo)/(hi-lo))*(H-m.t-m.b)};
  var g='';
  for(var t=lo;t<=hi+1e-9;t+=step)g+='<line class="gl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/><text class="tx" x="'+(m.l-8)+'" y="'+(y(t)+4).toFixed(1)+'" text-anchor="end">'+(step<1?t.toFixed(1):Math.round(t))+'</text>';
  var d=v.map(function(val,i){return(i?'L':'M')+x(i).toFixed(1)+' '+y(val).toFixed(1)}).join(' ');
  var xl=MONTHS.map(function(mo,i){return '<text class="tx" x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+mo+'</text>'}).join('');
  host.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Line chart, last 6 months">'+g+
   '<path class="ar" d="'+d+' L'+x(n-1).toFixed(1)+' '+(H-m.b)+' L'+x(0).toFixed(1)+' '+(H-m.b)+' Z"/><path class="ln" d="'+d+'"/>'+xl+
   '<line class="xh" id="'+c.id+'-xh" y1="'+m.t+'" y2="'+(H-m.b)+'" style="display:none"/><circle class="dotc" id="'+c.id+'-hd" r="5" style="display:none"/>'+
   '<circle class="dotc" cx="'+x(n-1).toFixed(1)+'" cy="'+y(v[n-1]).toFixed(1)+'" r="5" id="'+c.id+'-end"/>'+
   '<text class="endv" x="'+(x(n-1)+10).toFixed(1)+'" y="'+(y(v[n-1])+4).toFixed(1)+'">'+c.fmt(v[n-1])+'</text>'+
   '<rect x="'+m.l+'" y="0" width="'+(W-m.l-m.r+10)+'" height="'+H+'" fill="transparent" id="'+c.id+'-hit"/></svg><div class="tip" id="'+c.id+'-tip" style="display:none"></div>';
  var hit=document.getElementById(c.id+'-hit'),xh=document.getElementById(c.id+'-xh'),hd=document.getElementById(c.id+'-hd'),tip=document.getElementById(c.id+'-tip');
  function mv(e){
    var r=hit.getBoundingClientRect(),px=e.clientX-r.left+m.l,best=0,bd=1e9;
    for(var i=0;i<n;i++){var dd=Math.abs(x(i)-px);if(dd<bd){bd=dd;best=i}}
    xh.setAttribute('x1',x(best));xh.setAttribute('x2',x(best));xh.style.display='';
    hd.setAttribute('cx',x(best));hd.setAttribute('cy',y(v[best]));hd.style.display='';
    tip.innerHTML='<b>'+MONTHS[best]+' 2026</b> · '+c.fmt(v[best]);tip.style.left=x(best)+'px';tip.style.top=y(v[best])+'px';tip.style.display='';
  }
  function lv(){xh.style.display='none';hd.style.display='none';tip.style.display='none'}
  hit.addEventListener('pointermove',mv);hit.addEventListener('pointerdown',mv);hit.addEventListener('pointerleave',lv);
}
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(drawCharts,120)});

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act'),v=t.getAttribute('data-v');
  if(act==='login'){
    if(v==='minister'){session={role:'minister'};nav={}}
    else{var id=v.split(':')[1];session={role:'head',agencyId:id};nav={agencyId:id}}
    rFilter='all';showAll=false;window.scrollTo(0,0);render();
  }else if(act==='login-sup'){
    var uid=document.getElementById('supSel').value;session={role:'sup',unitId:uid,agencyId:unit(uid).ag};nav={agencyId:unit(uid).ag,unitId:uid};rFilter='all';showAll=false;window.scrollTo(0,0);render();
  }else if(act==='out'){session=null;nav={};rFilter='all';showAll=false;render()}
  else if(act==='go'){
    var p=v.split(':');
    if(p[0]==='national'){if(session.role==='minister')nav={}}
    else if(p[0]==='agency'){if(session.role==='minister'||session.agencyId===p[1])nav={agencyId:p[1]}}
    else if(p[0]==='unit'){var u=unit(p[1]);if(session.role==='minister'||(session.role==='head'&&session.agencyId===u.ag)){nav={agencyId:u.ag,unitId:p[1]};rFilter='all';showAll=false}}
    window.scrollTo(0,0);render();
  }else if(act==='metric'){metric=v;render()}
  else if(act==='sort'){if(sortKey===v)sortDir=-sortDir;else{sortKey=v;sortDir=v==='name'?1:-1}render()}
  else if(act==='filter'){rFilter=v;showAll=false;render()}
  else if(act==='more'){showAll=!showAll;render()}
});
render();
})();
</script>

</body>
</html>
