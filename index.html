<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAB Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Budgetoo layout: navy→sky→pale blue gradient, Inter, glass score, floating white cards. */
:root{
  --ink:#0f172a; --ink2:#475569; --muted:#64748b; --line:#e8eef5;
  --surface:#ffffff; --surface2:#f1f5f9;
  --accent:#1a5fb4; --accent-ink:#ffffff; --red:#c8102e; --dark:#111827;
  --good:#16a34a; --warn:#ca8a04; --high:#ea580c; --crit:#c8102e;
  --f:'Inter',system-ui,-apple-system,sans-serif;
  --radius:24px; --shadow:0 12px 40px rgba(15,40,80,.08); --shadow-sm:0 6px 20px rgba(15,40,80,.06);
  --shell:1160px;
  color-scheme:light;
}

*{box-sizing:border-box}
html{min-height:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;background:#070b2a;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background-color:#070b2a;
  background-image:
    radial-gradient(ellipse 75% 58% at 5% 0%, #5ce1ff 0%, rgba(80,200,255,.7) 22%, rgba(50,140,255,.28) 45%, transparent 68%),
    radial-gradient(ellipse 70% 55% at 98% 0%, #ff4b6e 0%, rgba(240,80,120,.75) 24%, rgba(200,50,110,.32) 48%, transparent 68%),
    radial-gradient(ellipse 50% 40% at 62% 8%, rgba(180,110,210,.4) 0%, transparent 55%),
    radial-gradient(ellipse 90% 55% at 50% 110%, #05081f 0%, transparent 50%),
    linear-gradient(185deg,#15245f 0%,#0a114e 38%,#070b2a 100%);
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.in{max-width:var(--shell);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f);margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px);line-height:1.08;color:#fff}
h2{font-size:18px;line-height:1.2}
.mono{font-feature-settings:"tnum";letter-spacing:.02em}

/* header */
.top{padding:18px 0 8px;position:relative;z-index:5}
.top .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;justify-self:start}
.brand svg{flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
.brand b{font-size:22px;font-weight:700;letter-spacing:.02em;color:#fff;line-height:1;display:block}
.brand span{font-size:11px;font-weight:500;opacity:.78;display:block;line-height:1.25;color:#fff}
.pills{display:flex;gap:2px;justify-self:center;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:4px;border:1px solid rgba(255,255,255,.14)}
.pill{color:rgba(255,255,255,.86);text-decoration:none;border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.pill.on,.pill:hover{background:rgba(255,255,255,.22);color:#fff}
.who{display:flex;align-items:center;gap:10px;min-width:0;justify-self:end}
.who .role{font-size:13px;font-weight:500;color:rgba(255,255,255,.9);text-align:right;min-width:0;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;box-shadow:var(--shadow-sm);border:2px solid rgba(255,255,255,.55)}
.btn{background:#fff;border:0;color:var(--ink);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow-sm)}
.btn:hover{background:#f8fafc}

main{padding-block:8px 56px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:28px;align-items:end;padding:18px 0 28px;color:#fff}
.hero-copy{min-width:0}
.eye{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:500;color:rgba(255,255,255,.78);margin-bottom:10px;align-items:center}
.eye button{background:none;border:0;padding:0;color:#fff;text-decoration:underline;text-underline-offset:2px;font-weight:600}
.hero h1{margin:0 0 8px}
.hero .lede{margin:0 0 18px;max-width:48ch;color:rgba(255,255,255,.88);font-size:15px;font-weight:400}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cta{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:600;border:0;text-decoration:none}
.cta.primary{background:var(--dark);color:#fff}
.cta.primary:hover{background:#000}
.cta.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.cta.ghost:hover{background:#f8fafc}
.cta svg{flex:none}
.asof{font-size:12px;color:rgba(255,255,255,.65);margin-top:12px;font-weight:500}

/* glass score card — Budgetoo July Plan layout */
.glass{
  background:rgba(255,255,255,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.28);border-radius:var(--radius);padding:22px 24px;
  box-shadow:0 16px 48px rgba(7,20,55,.18);color:#fff;min-width:0;align-self:stretch;
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;
}
.glass .gl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.glass .gl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin:0}
.glass .gl small{display:block;margin-top:4px;font-size:11px;letter-spacing:.04em;opacity:.75;font-weight:500}
.glass .pct{font-size:42px;font-weight:700;line-height:1;letter-spacing:-.03em;opacity:.95}
.glass .glass-val{font-size:clamp(36px,4.5vw,52px);font-weight:700;line-height:1.05;letter-spacing:-.03em;margin:8px 0 4px}
.glass .glass-val small{font-size:18px;font-weight:600;opacity:.85;margin-left:4px}
.glass .sub{margin:0;font-size:14px;font-weight:500;opacity:.9}
.glass .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.glass .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;width:fit-content}
.glass .d{font-size:12px;font-weight:600;white-space:nowrap}
.glass .d.good{color:#bbf7d0}.glass .d.bad{color:#fecaca}.glass .d.flat{color:rgba(255,255,255,.85)}
.glass .spark path{stroke:#fff}.glass .spark circle{fill:#fff;stroke:rgba(255,255,255,.35)}

/* sheet / cards */
.sheet{position:relative}
.grid{display:grid;gap:16px}
.stage{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);margin-bottom:16px;align-items:stretch}
.stage > .card,.stage > .chart-card{height:100%}
.stat-grid{grid-template-columns:1fr 1fr;gap:16px;height:100%}
.two-eq{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-bottom:16px}
@media (max-width:820px){
  .top .in{grid-template-columns:1fr;justify-items:stretch}
  .brand,.who,.pills{justify-self:stretch}
  .pills{overflow-x:auto;justify-content:flex-start}
  .who{justify-content:space-between}
  .hero{grid-template-columns:1fr}
  .stage{grid-template-columns:1fr}
}
.card{
  background:var(--surface);border:0;border-radius:var(--radius);padding:20px;
  min-width:0;box-shadow:var(--shadow);
}
.chart-card{display:flex;flex-direction:column}
.chart-card .chart{flex:1;min-height:240px}
.card h2{margin-bottom:2px;color:var(--ink)}
.card .sub{color:var(--ink2);font-size:13px;margin:0 0 14px;font-weight:500}
.sec{margin:28px 0 12px;color:#fff}
.sec h2{color:#fff;font-size:20px}
.sec p{margin:4px 0 0;color:rgba(255,255,255,.82);font-size:14px}

.kpi{display:flex;flex-direction:column;gap:4px;min-height:132px;position:relative}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:32px;font-weight:700;line-height:1.05;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px;color:var(--ink)}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink2)}
.kpi .s{font-size:13px;color:var(--ink2);font-weight:500;margin-top:auto}
.kpi .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.kpi .ico{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.d{font-size:12px;font-weight:600;white-space:nowrap}
.d.good{color:var(--good)}.d.bad{color:var(--crit)}.d.flat{color:var(--ink2)}
.spark{flex:none;display:block}
.spark path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}

.callout{background:rgba(255,255,255,.92);border:0;border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow-sm);color:var(--ink)}
.callout svg{flex:none;color:var(--warn);margin-top:2px}
.callout p{margin:0;font-size:14px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.tab{background:var(--surface2);border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink2)}
.tab[aria-pressed="true"]{background:var(--dark);color:#fff}
.chart{position:relative;width:100%;min-height:240px}
.chart svg{display:block;overflow:visible}
.gl-line{stroke:var(--line);stroke-width:1}
.tx{fill:var(--muted);font-size:11px;font-family:var(--f)}
.ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--accent);opacity:.12}
.dotc{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.endv{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--f)}
.xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--dark);color:#fff;border-radius:10px;padding:7px 11px;font-size:12px;font-weight:500;white-space:nowrap;transform:translate(-50%,-110%);z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.2)}
details{margin-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--accent);font-weight:600}

.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600}
th button{background:none;border:0;padding:0;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;font-size:inherit;color:inherit}
th button[data-on="1"]{color:var(--accent)}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
.lk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:3px}
.cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mini{width:56px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.mini i{display:block;height:100%;background:var(--accent)}
.chip{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid}
.chip.stable{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.chip.watch{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.chip.priority{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:color-mix(in srgb,var(--crit) 10%,var(--surface))}
.lvp{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.l1{background:var(--good)}.l2{background:var(--warn)}.l3{background:var(--high)}.l4{background:var(--crit)}

.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.hb .tr{height:12px;background:var(--surface2);border-radius:6px;position:relative}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:0 5px 5px 0;min-width:2px}
.hb .tr u{position:absolute;top:-3px;width:2px;height:18px;background:var(--ink);text-decoration:none}
.hb .vv{font-weight:600;text-align:right;white-space:nowrap}
.key{font-size:12px;color:var(--ink2);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}

.lvl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lvl:last-child{border-bottom:0}
.lvl .t{min-width:0}.lvl .t b{display:block;font-size:14px}.lvl .t span{font-size:12px;color:var(--ink2)}
.lvl .n{font-size:22px;font-weight:700;letter-spacing:-.02em}

.units{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.unit{background:var(--surface);border:0;border-radius:var(--radius);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.unit:hover{box-shadow:0 16px 44px rgba(15,40,80,.12)}
.unit b{font-size:15px}
.unit .m{font-size:13px;color:var(--ink2)}
.seg{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden}
.seg i{display:block;min-width:3px}
.seg .g{background:var(--good)}.seg .r{background:var(--warn)}.seg .h{background:var(--crit)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:6px}

.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border-bottom:0}
.feed small{display:block;color:var(--ink2);font-size:12px}
.feed time{color:var(--ink2);font-size:12px;white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.lock{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:12px}
.note{display:flex;gap:10px;font-size:13px;color:var(--ink2);margin-top:20px;padding:14px 16px;border:0;border-radius:var(--radius);background:rgba(255,255,255,.92);box-shadow:var(--shadow-sm)}
.note svg{flex:none;color:var(--accent);margin-top:2px}
.more{margin-top:10px;background:var(--surface2);border:0;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600}

.rec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.rec-big{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.rec-big small{font-size:16px;font-weight:600;color:var(--ink2)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px}

/* login */
.login .top{padding-top:22px}
.login .hero{padding-top:28px;grid-template-columns:1fr}
.login .hero h1{font-size:clamp(36px,5vw,52px)}
.lh{font-size:13px;font-weight:600;margin:22px 0 10px;color:rgba(255,255,255,.85);letter-spacing:.04em;text-transform:uppercase}
.lg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));margin-top:4px}
.acct{background:#fff;border:0;border-radius:var(--radius);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow)}
.acct:hover{box-shadow:0 16px 44px rgba(15,40,80,.12)}
.acct b{font-size:15px;color:var(--ink)}.acct span{font-size:13px;color:var(--ink2);font-weight:500}
.acct.big{box-shadow:0 16px 44px rgba(15,40,80,.14);outline:2px solid rgba(255,255,255,.55)}
.selrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
select{font:inherit;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:12px 16px;min-width:0;max-width:100%;flex:1 1 260px;box-shadow:var(--shadow-sm);font-weight:500}
.go{background:var(--dark);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.card,.unit,.acct,.cta,.btn{transition:box-shadow .18s,background .15s,transform .15s}}
</style>
</head>

/* helpers */
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function wavg(a,f,w){w=w||function(x){return x.n};return sum(a,function(x){return f(x)*w(x)})/sum(a,w)}
function agency(id){return AG.filter(function(a){return a.id===id})[0]}
function unit(id){return UNITS.filter(function(u){return u.id===id})[0]}
function fmt(n){return Math.round(n).toLocaleString('en-MY')}
function alloc(total,w){var raw=w.map(function(x){return x*total}),fl=raw.map(Math.floor),rem=total-sum(fl,function(x){return x});raw.map(function(r,i){return[r-fl[i],i]}).sort(function(a,b){return b[0]-a[0]}).slice(0,rem).forEach(function(o){fl[o[1]]++});return fl}
function agg(list){
  var ser=function(k){return MONTHS.map(function(_,i){return wavg(list,function(x){return x[k][i]})})};
  var tot=function(k){return sum(list,function(x){return x[k]})};
  var wa=sum(list,function(x){return x.alerts[5]});
  return {n:tot('n'),score:ser('score'),stress:ser('stress'),burn:ser('burn'),
    alerts:MONTHS.map(function(_,i){return sum(list,function(x){return x.alerts[i]})}),
    int:tot('int'),intP:tot('intP'),ref:tot('ref'),refP:tot('refP'),kkm:tot('kkm'),kkmP:tot('kkmP'),
    rec:wavg(list,function(x){return x.rec},function(x){return x.int}),recP:wavg(list,function(x){return x.recP},function(x){return x.intP}),
    chk:wavg(list,function(x){return x.chk}),
    open:[0,1,2].map(function(i){return sum(list,function(x){return x.open[i]})}),
    ind:IND.map(function(_,i){return wa?sum(list,function(x){return x.ind[i]*x.alerts[5]})/wa:0})};
}
function status(score,alerts,prev){if(score<78)return'Priority';if(score<82||(prev>=5&&alerts/prev>=1.25))return'Watch';return'Stable'}
function band(s){return s>=80?'Good':s>=70?'Fair':'Concern'}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dstr(off){var d=new Date(2026,9,20);d.setDate(d.getDate()+off);return d.getDate()+' '+MONTH_NAMES[d.getMonth()]}

var unitCache={};
function buildUnit(u){
  if(unitCache[u.id])return unitCache[u.id];
  var r=rng(hash(u.id)),used={};
  var code=function(){var c;do{c=u.code+'-'+(1000+Math.floor(r()*9000))}while(used[c]);used[c]=1;return c};
  var att=u.risk+u.high,action=Math.round(u.high*.45),refs=Math.round(u.high*.33),fu=Math.round(att*.23);
  var crit=u.high>=10?Math.min(refs,Math.max(1,Math.round(u.high/9))):0;
  var rows=[],i;
  for(i=0;i<u.high;i++){
    var role,level,step,ref='—';
    if(i<refs){role='ref';level=i<crit?4:3;step=i%2===0?5:6;ref=step===5?'Internal counsellor':'KKM Mental Health Services'}
    else if(i<refs+action){role='action';level=3;step=3}
    else{role='follow';level=3;step=7}
    rows.push({id:code(),level:level,step:step,role:role,ref:ref,ind:level===4?'Urgent welfare alert':IND[Math.floor(r()*6)]});
  }
  for(i=0;i<u.risk;i++)rows.push({id:code(),level:2,step:r()<.2?7:4,role:'engage',ref:'—',ind:IND[Math.floor(r()*6)]});
  var idx=rows.map(function(_,k){return k});
  for(i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}
  rows.forEach(function(x){x.due=1+Math.floor(r()*12)});
  idx.slice(0,fu).forEach(function(k){rows[k].due=-Math.floor(r()*3)});
  rows.sort(function(a,b){return b.level-a.level||a.due-b.due});
  var times=['Today 09:25','Today 08:40','Today 07:10','Yesterday 17:20','Yesterday 14:05'];
  var feed=rows.slice(0,5).map(function(x,k){return {id:x.id,ind:x.ind,level:x.level,time:times[k]}});
  return unitCache[u.id]={u:u,rows:rows,action:action,refs:refs,fu:fu,feed:feed};
}

function delta(cur,prev,mode,goodDir){
  var d=mode==='pct'?(cur-prev)/prev*100:cur-prev;
  var txt=mode==='pct'?(d>=0?'+':'')+Math.round(d)+'%':(d>=0?'+':'')+d.toFixed(1)+' pts';
  var cls=Math.abs(d)<0.05?'flat':((d>0)===(goodDir==='up')?'good':'bad');
  return '<span class="d '+cls+'"><span aria-hidden="true">'+(d>0.05?'▲':d<-0.05?'▼':'■')+'</span> '+txt+' vs Sep</span>';
}
function spark(vals){
  var w=92,h=26,mn=Math.min.apply(0,vals),mx=Math.max.apply(0,vals),sp=(mx-mn)||1;
  var x=function(i){return 2+i*(w-8)/(vals.length-1)},y=function(v){return 3+(1-(v-mn)/sp)*(h-8)};
  var d=vals.map(function(v,i){return(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)}).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><path d="'+d+'"/><circle cx="'+x(vals.length-1).toFixed(1)+'" cy="'+y(vals[vals.length-1]).toFixed(1)+'" r="3"/></svg>';
}

    'All KDN enforcement agencies, '+fmt(a.n)+' personnel. Compare agencies and open any one for its own dashboard.',
    '<a class="cta primary" href="#agencies">'+I.arrow+' Open agencies</a>',
    scopeGhost('National, all agencies'),
    glassScore(a)
  )+
  '<div class="sheet">'+call+
   '<div class="grid stage">'+stageKpis(a)+trendCard(a,'National')+'</div>'+
   '<div class="grid two-eq">'+recoveryCard(a)+pathwayCard(a)+'</div>'+
   '<div class="grid two-eq">'+casesCard(a)+indCard(a)+'</div>'+
   '<div class="sec" id="agencies"><h2>Agencies</h2><p>Open an agency to see its own dashboard. Status: Priority below score 78, Watch below 82 or alerts up 25% or more on last month.</p></div>'+
   '<div class="card"><div class="tw"><table><thead><tr>'+th('name','Agency')+th('n','Personnel',1)+th('score','Wellbeing score')+th('alerts','High-risk alerts',1)+th('per1k','Per 1,000',1)+th('hi','Open L3+L4',1)+th('chk','Check-ins',1)+'<th>'+m.label+' trend</th>'+th('st','Status')+'</tr></thead><tbody>'+body+'</tbody></table></div></div>'+
   '<div class="grid two-eq" style="margin-top:16px"><div class="card"><h2>High-risk alerts per 1,000 personnel</h2><p class="sub">This month, with the number of alerts. The black tick marks last month.</p>'+bars+'</div>'+levelLegend()+'</div>'+
   privacyNote('nat')+'</div>';
}

function agencyView(id){
  var x=agency(id),a=agg([x]);
  var al=alloc(x.alerts[5],RW_A),alP=alloc(x.alerts[4],RW_A),hi=alloc(x.open[1]+x.open[2],RW_A),pn=alloc(x.n,RW_N);
  var reg=REGIONS.map(function(r,i){var sc=Math.round(x.score[5])+R_OFF[i];return {r:r,n:pn[i],sc:sc,al:al[i],hi:hi[i],st:status(sc,al[i],0)}});
  var wr=reg.filter(function(r){return r.st!=='Stable'});
  var call=wr.length?'<div class="callout">'+I.warn+'<p><b>Needs attention:</b> '+wr.map(function(r){return r.r+' ('+r.st.toLowerCase()+', score '+r.sc+')'}).join(', ')+'.</p></div>':'';
  var tbl=reg.map(function(r){return '<tr><td><b>'+r.r+'</b></td><td class="num">'+fmt(r.n)+'</td><td><div class="cell"><span class="mini"><i style="width:'+r.sc+'%"></i></span><b>'+r.sc+'</b></div></td><td class="num">'+r.al+'</td><td class="num">'+r.hi+'</td><td>'+chip(r.st)+'</td></tr>'}).join('');
  var us=UNITS.filter(function(u){return u.ag===id}).map(function(u){
    return '<button class="unit" data-act="go" data-v="unit:'+u.id+'"><b>'+u.name+'</b><span class="m">'+u.region+' · '+u.tot+' officers</span>'+
    '<div class="seg" aria-hidden="true"><i class="g" style="flex:'+u.good+'"></i><i class="r" style="flex:'+u.risk+'"></i><i class="h" style="flex:'+u.high+'"></i></div>'+
    '<span class="m">'+u.good+' good · '+u.risk+' at risk · <b style="color:var(--ink)">'+u.high+' high risk</b></span></button>'}).join('');
  var cr=[];
  if(session.role==='minister')cr.push({t:'National',go:'national'});
  cr.push({t:x.short});
  return heroBlock(
    cr,
    x.short+' wellbeing dashboard',
    x.name+(x.head?' · '+x.head:''),
    '<a class="cta primary" href="#units">'+I.arrow+' Open units</a>',
    scopeGhost(session.role==='minister'?x.short+' (viewing as Minister)':x.short+' only'),
    glassScore(a)
  )+
  '<div class="sheet">'+call+
   '<div class="grid stage">'+stageKpis(a)+trendCard(a,x.short)+'</div>'+
   '<div class="grid two-eq">'+recoveryCard(a)+pathwayCard(a)+'</div>'+
   '<div class="grid two-eq">'+casesCard(a)+indCard(a)+'</div>'+
   '<div class="sec" id="regions"><h2>Regions</h2><p>Personnel and alerts by region. Status: Priority below score 78, Watch below 82.</p></div>'+
   '<div class="card"><div class="tw"><table><thead><tr><th>Region</th><th class="num">Personnel</th><th>Wellbeing score</th><th class="num">High-risk alerts</th><th class="num">Open L3+L4</th><th>Status</th></tr></thead><tbody>'+tbl+'</tbody></table></div></div>'+
   '<div class="sec" id="units"><h2>Unit supervisor dashboards</h2><p>Open a unit to see its team view, as its supervisor sees it.</p></div><div class="grid units">'+us+'</div>'+
   '<div class="grid two-eq" style="margin-top:16px">'+levelLegend()+'</div>'+
   privacyNote('head')+'</div>';
}

function unitView(id){
  var u=unit(id),ag=agency(u.ag),d=buildUnit(u);
  var cr=[];
  if(session.role==='minister')cr.push({t:'National',go:'national'});
  if(session.role!=='sup')cr.push({t:ag.short,go:'agency:'+ag.id});
  cr.push({t:u.name});
  var f=rFilter,rows=d.rows.filter(function(r){return f==='all'||(f==='high'&&r.level>=3)||(f==='risk'&&r.level===2)||(f==='action'&&r.role==='action')||(f==='due'&&r.due<=0)});
  var counts={all:d.rows.length,high:u.high,risk:u.risk,action:d.action,due:d.fu};
  var chips=[['all','All needing attention'],['high','High risk'],['risk','At risk'],['action','Action needed'],['due','Follow-up due']].map(function(c){return '<button class="tab" data-act="filter" data-v="'+c[0]+'" aria-pressed="'+(f===c[0])+'">'+c[1]+' ('+counts[c[0]]+')</button>'}).join('');
  var shown=showAll?rows:rows.slice(0,12);
  var body=shown.map(function(r){
    var due=r.due<0?'<b style="color:var(--crit)">Overdue '+(-r.due)+'d</b>':r.due===0?'<b>Today</b>':dstr(r.due);
    return '<tr><td class="mono"><b>'+r.id+'</b></td><td>'+lvp(r.level)+'</td><td>'+r.ind+'</td><td>'+STEP_TXT[r.step]+'</td><td>'+due+'</td><td>'+r.ref+'</td><td><span class="lock">'+I.lock+' Counsellor only</span></td></tr>'}).join('');
  var more=rows.length>12?'<button class="more" data-act="more">'+(showAll?'Show fewer':'Show all '+rows.length)+'</button>':'';
  var feed=d.feed.map(function(x){return '<li><div><b>'+x.ind+'</b><small>'+x.id+' · '+(x.level>=4?'Level 4':x.level===3?'Level 3':'Level 2')+'</small></div><time>'+x.time+'</time></li>'}).join('');
  var unitStage='<div class="grid stat-grid">'+
   kpiCard('Total officers',u.tot,'','Unit strength')+
   kpiCard('Good',u.good,'','Stable wellbeing')+
   kpiCard('At risk',u.risk,'','Level 2')+
   kpiCard('Alerts requiring action',d.action,'','High-risk follow-through')+
  '</div>';
  return heroBlock(
    cr,
    u.name,
    ag.short+' · '+u.region+' region · real-time visibility, timely action.',
    '<a class="cta primary" href="#officers">'+I.arrow+' Open officers</a>',
    scopeGhost(session.role==='sup'?u.name+' only':u.name),
    glassUnit(u,d)
  )+
  '<div class="sheet">'+
   '<div class="grid stage">'+unitStage+
    '<div class="card"><h2>Team wellbeing status</h2><p class="sub">Latest assessment for each officer in the unit.</p><div class="seg" style="height:16px" aria-hidden="true"><i class="g" style="flex:'+u.good+'"></i><i class="r" style="flex:'+u.risk+'"></i><i class="h" style="flex:'+u.high+'"></i></div>'+
    '<div class="leg"><span><i class="dot l1"></i>Good '+u.good+' ('+Math.round(u.good/u.tot*100)+'%)</span><span><i class="dot l2"></i>At risk '+u.risk+' ('+Math.round(u.risk/u.tot*100)+'%)</span><span><i class="dot l4"></i>High risk '+u.high+' ('+Math.round(u.high/u.tot*100)+'%)</span></div></div></div>'+
   '<div class="grid two-eq"><div class="card"><h2>Follow-ups & referrals</h2><p class="sub">This unit</p><div class="rec-big">'+d.fu+'<small> follow-ups due</small></div><p class="sub" style="margin-top:10px">'+d.refs+' referrals in progress · '+d.action+' alerts requiring action</p></div>'+
   '<div class="card"><h2>Recent alerts</h2><p class="sub">Newest first</p><ul class="feed">'+feed+'</ul></div></div>'+
   '<div class="sec" id="officers"><h2>Officers needing attention</h2><p>Officer IDs are coded. Names are not shown in KAB.</p></div>'+
   '<div class="card"><div class="filters" role="group" aria-label="Filter officers">'+chips+'</div><div class="tw"><table><thead><tr><th>Officer ID</th><th>Level</th><th>AI indicator</th><th>Escalation step</th><th>Follow-up</th><th>Referral</th><th>Case notes</th></tr></thead><tbody>'+body+'</tbody></table></div>'+more+'</div>'+
   '<div class="grid two-eq" style="margin-top:16px">'+levelLegend()+'</div>'+
   privacyNote('sup')+'</div>';
}

function loginView(){
  var heads=AG.filter(function(a){return a.head}).map(function(a){return '<button class="acct" data-act="login" data-v="head:'+a.id+'"><b>'+a.head+'</b><span>'+a.short+' only</span></button>'}).join('');
  var opts=UNITS.map(function(u){return '<option value="'+u.id+'">'+agency(u.ag).short+' · '+u.name+'</option>'}).join('');
  return '<div class="login"><header class="top"><div class="in"><div class="brand">'+I.shield+'<div><b>KAB</b><span>Kesejahteraan Anggota Bersepadu</span></div></div></div></header>'+
   '<main class="in"><section class="hero"><div class="hero-copy"><div class="eye"><span>Sign in</span></div><h1>KAB</h1><p class="lede">Kesejahteraan Anggota Bersepadu. Wellbeing dashboards for the Minister of Home Affairs, each agency head and unit supervisors.</p></div></section>'+
   '<div class="sheet"><p class="lh" style="margin-top:0">Ministerial</p><div class="lg"><button class="acct big" data-act="login" data-v="minister"><b>Menteri Dalam Negeri</b><span>All agencies</span></button></div>'+
   '<p class="lh">Agency heads</p><div class="lg">'+heads+'</div>'+
   '<p class="lh">Unit supervisors</p><div class="selrow"><select id="supSel" aria-label="Choose a unit">'+opts+'</select><button class="go" data-act="login-sup">Open supervisor view</button></div>'+
   '<div class="note">'+I.lock+'<span>Preview with sample data. Each role loads only its own scope: an agency head sees one agency, a supervisor sees one unit. A live system needs agency single sign-on and server-side access control behind this.</span></div></div></main></div>';
}

function guard(){
  if(session.role==='head'){nav.agencyId=session.agencyId;if(nav.unitId&&unit(nav.unitId).ag!==session.agencyId)nav.unitId=null}
  if(session.role==='sup')nav={agencyId:session.agencyId,unitId:session.unitId};
  if(nav.unitId)nav.agencyId=unit(nav.unitId).ag;
}
function roleTitle(){
  if(session.role==='minister')return 'Menteri Dalam Negeri';
  if(session.role==='head')return agency(session.agencyId).head+' · '+agency(session.agencyId).short;
  return 'Penyelia · '+unit(session.unitId).name;
}
function navPills(){
  if(nav.unitId)return '<nav class="pills" aria-label="Sections"><a class="pill on" href="#">Overview</a><a class="pill" href="#officers">Officers</a></nav>';
  if(nav.agencyId)return '<nav class="pills" aria-label="Sections"><a class="pill on" href="#">Overview</a><a class="pill" href="#regions">Regions</a><a class="pill" href="#units">Units</a></nav>';
  return '<nav class="pills" aria-label="Sections"><a class="pill on" href="#">Overview</a><a class="pill" href="#agencies">Agencies</a></nav>';
}
function render(){
  charts=[];
  if(!session){app.innerHTML=loginView();return}
  guard();
  var view=nav.unitId?unitView(nav.unitId):nav.agencyId?agencyView(nav.agencyId):nationalView();
  var initials=session.role==='minister'?'MD':session.role==='head'?agency(session.agencyId).short.slice(0,2).toUpperCase():'SU';
  app.innerHTML='<header class="top"><div class="in"><div class="brand">'+I.shield+'<div><b>KAB</b><span>Kesejahteraan Anggota Bersepadu</span></div></div>'+navPills()+'<div class="who"><span class="role">'+roleTitle()+'</span><button class="btn" data-act="out">Sign out</button><span class="avatar" aria-hidden="true">'+initials+'</span></div></div></header><main class="in">'+view+'</main>';
  drawCharts();
}

/* ---------- charts ---------- */
function drawCharts(){charts.forEach(drawLine)}
function drawLine(c){
  var host=document.getElementById(c.id);if(!host)return;
  var W=Math.max(280,host.clientWidth),H=230,m={l:42,r:50,t:16,b:28},v=c.vals,n=v.length;
  var mn=Math.min.apply(0,v),mx=Math.max.apply(0,v),sp=(mx-mn)||1,lo=mn-sp*.6,hi=mx+sp*.6,raw=(hi-lo)/3;
  var step=[1,2,2.5,5,10,20,50,100].filter(function(s){return s>=raw})[0]||100;
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  var x=function(i){return m.l+i*(W-m.l-m.r)/(n-1)},y=function(val){return m.t+(1-(val-lo)/(hi-lo))*(H-m.t-m.b)};
  var g='';
  for(var t=lo;t<=hi+1e-9;t+=step)g+='<line class="gl-line" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/><text class="tx" x="'+(m.l-8)+'" y="'+(y(t)+4).toFixed(1)+'" text-anchor="end">'+(step<1?t.toFixed(1):Math.round(t))+'</text>';
  var d=v.map(function(val,i){return(i?'L':'M')+x(i).toFixed(1)+' '+y(val).toFixed(1)}).join(' ');
  var xl=MONTHS.map(function(mo,i){return '<text class="tx" x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+mo+'</text>'}).join('');
  host.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Line chart, last 6 months">'+g+
   '<path class="ar" d="'+d+' L'+x(n-1).toFixed(1)+' '+(H-m.b)+' L'+x(0).toFixed(1)+' '+(H-m.b)+' Z"/><path class="ln" d="'+d+'"/>'+xl+
   '<line class="xh" id="'+c.id+'-xh" y1="'+m.t+'" y2="'+(H-m.b)+'" style="display:none"/><circle class="dotc" id="'+c.id+'-hd" r="5" style="display:none"/>'+
   '<circle class="dotc" cx="'+x(n-1).toFixed(1)+'" cy="'+y(v[n-1]).toFixed(1)+'" r="5" id="'+c.id+'-end"/>'+
   '<text class="endv" x="'+(x(n-1)+10).toFixed(1)+'" y="'+(y(v[n-1])+4).toFixed(1)+'">'+c.fmt(v[n-1])+'</text>'+
   '<rect x="'+m.l+'" y="0" width="'+(W-m.l-m.r+10)+'" height="'+H+'" fill="transparent" id="'+c.id+'-hit"/></svg><div class="tip" id="'+c.id+'-tip" style="display:none"></div>';
  var hit=document.getElementById(c.id+'-hit'),xh=document.getElementById(c.id+'-xh'),hd=document.getElementById(c.id+'-hd'),tip=document.getElementById(c.id+'-tip');
  function mv(e){
    var r=hit.getBoundingClientRect(),px=e.clientX-r.left+m.l,best=0,bd=1e9;
    for(var i=0;i<n;i++){var dd=Math.abs(x(i)-px);if(dd<bd){bd=dd;best=i}}
    xh.setAttribute('x1',x(best));xh.setAttribute('x2',x(best));xh.style.display='';
    hd.setAttribute('cx',x(best));hd.setAttribute('cy',y(v[best]));hd.style.display='';
    tip.innerHTML='<b>'+MONTHS[best]+' 2026</b> · '+c.fmt(v[best]);tip.style.left=x(best)+'px';tip.style.top=y(v[best])+'px';tip.style.display='';
  }
  function lv(){xh.style.display='none';hd.style.display='none';tip.style.display='none'}
  hit.addEventListener('pointermove',mv);hit.addEventListener('pointerdown',mv);hit.addEventListener('pointerleave',lv);
}
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(drawCharts,120)});

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act'),v=t.getAttribute('data-v');
  if(act==='login'){
    if(v==='minister'){session={role:'minister'};nav={}}
    else{var id=v.split(':')[1];session={role:'head',agencyId:id};nav={agencyId:id}}
    rFilter='all';showAll=false;window.scrollTo(0,0);render();
  }else if(act==='login-sup'){
    var uid=document.getElementById('supSel').value;session={role:'sup',unitId:uid,agencyId:unit(uid).ag};nav={agencyId:unit(uid).ag,unitId:uid};rFilter='all';showAll=false;window.scrollTo(0,0);render();
  }else if(act==='out'){session=null;nav={};rFilter='all';showAll=false;render()}
  else if(act==='go'){
    var p=v.split(':');
    if(p[0]==='national'){if(session.role==='minister')nav={}}
    else if(p[0]==='agency'){if(session.role==='minister'||session.agencyId===p[1])nav={agencyId:p[1]}}
    else if(p[0]==='unit'){var u=unit(p[1]);if(session.role==='minister'||(session.role==='head'&&session.agencyId===u.ag)){nav={agencyId:u.ag,unitId:p[1]};rFilter='all';showAll=false}}
    window.scrollTo(0,0);render();
  }else if(act==='metric'){metric=v;render()}
  else if(act==='sort'){if(sortKey===v)sortDir=-sortDir;else{sortKey=v;sortDir=v==='name'?1:-1}render()}
  else if(act==='filter'){rFilter=v;showAll=false;render()}
  else if(act==='more'){showAll=!showAll;render()}
});
render();
})();
</script>

</body>
</html>
